# Fusion stack wiring.
#
# Avrone's real default port is 8710 (AVRONE_PORT). CycleKernal CognitiveBridge
# listens on 8090. Port 8080 is CycleKernal's frontend, not this relay.
#
# The avrone and cognitive-bridge build contexts are NOT in this repository.
# `docker compose -f docker-compose.avrone.yml up` cannot build those two
# services until ./Avrone and ./cognitive-bridge exist and implement CONTRACT.md.
# The relay service only needs this repo.

services:
  avrone:
    build: ./Avrone
    ports:
      - "8710:8710"
    environment:
      - AVRONE_PORT=8710
      - AVRONE_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8710/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cognitive-bridge:
    build: ./cognitive-bridge
    ports:
      - "8090:8090"
    environment:
      - CK_PORT=8090
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  relay:
    image: python:3.12-slim
    working_dir: /opt/fusion
    volumes:
      - ./:/opt/fusion:ro
      - fusion-state:/state
    command: python -m bridge.avrone_cyclekernal_link
    depends_on:
      avrone:
        condition: service_healthy
      cognitive-bridge:
        condition: service_healthy
    environment:
      AVRONE_BASE: http://avrone:8710
      CK_BASE: http://cognitive-bridge:8090
      FUSION_TOKEN: ${FUSION_TOKEN:-}
      FUSION_STATE_PATH: /state/seen.json
      FUSION_CYCLES: "0"
      FUSION_INTERVAL: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    restart: unless-stopped

volumes:
  fusion-state:
